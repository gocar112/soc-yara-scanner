name: Python security suite checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python package
        shell: pwsh
        run: python -m compileall securitysuite tools tests

      - name: Validate dashboard JavaScript
        shell: pwsh
        run: |
          node --check web/app.js
          node --check web/console.js

      - name: Run boundary and workflow tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run smoke tests
        shell: pwsh
        run: python tests/smoke.py

      - name: Generate database summary
        shell: pwsh
        run: python tools/summarize_database.py --output docs/database-summary.md
