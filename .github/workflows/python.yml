name: Python security suite checks

# Runs the suite on Windows and Linux, on three Python versions.
#
# Windows coverage was impossible here until this repository was renamed. The
# old name ended with a period, and Windows cannot create a directory whose
# name ends in ".", so actions/checkout failed before any step ran:
#
#   Directory 'D:\a\-SOC-Detector-YARA-Scanner.\-SOC-Detector-YARA-Scanner.'
#   does not exist
#
# Every step below uses bash, which is present on both runners, so one
# definition covers both platforms rather than two that can drift apart.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python package
        run: python -m compileall securitysuite tools tests

      - name: Validate dashboard JavaScript
        run: |
          node --check web/app.js
          for f in web/js/*.js; do node --check "$f"; done

      - name: Run smoke tests
        run: python tests/smoke.py

      - name: Run API tests
        run: python tests/test_api.py

      - name: Run hunt query tests
        run: python tests/test_hunt.py

      - name: Run correlation and case tests
        run: python tests/test_cases.py

      - name: Generate database summary
        run: python tools/summarize_database.py --output docs/database-summary.md
