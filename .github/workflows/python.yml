name: Python security suite checks

# Runs on Linux, not windows-latest like the mirror repo does.
#
# This repository's name ends with a period. Windows cannot create a directory
# whose name ends in ".", so actions/checkout fails before any step runs:
#
#   Directory 'D:\a\-SOC-Detector-YARA-Scanner.\-SOC-Detector-YARA-Scanner.'
#   does not exist
#
# CI here has therefore never been able to pass. Ubuntu has no such
# restriction. The real fix is to rename the repository; until then this at
# least runs the suite. The Windows-specific paths stay covered by the same
# workflow in security-suite-dashboard.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python package
        run: python -m compileall securitysuite tools tests

      - name: Validate dashboard JavaScript
        run: |
          node --check web/app.js
          for f in web/js/*.js; do node --check "$f"; done

      - name: Run smoke tests
        run: python tests/smoke.py

      - name: Run API tests
        run: python tests/test_api.py

      - name: Run hunt query tests
        run: python tests/test_hunt.py

      - name: Run correlation and case tests
        run: python tests/test_cases.py

      - name: Generate database summary
        run: python tools/summarize_database.py --output docs/database-summary.md
